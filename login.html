<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfabetiza Tech — Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ ENCABEZADO ============ -->
  <header class="site-header">
    <div class="contenedor">
      <a href="index.html" class="logo">Alfabetiza Tech</a>
      <nav class="nav-actions">
        <a href="register.html" class="btn btn-solid">Regístrate</a>
      </nav>
    </div>
  </header>

  <!-- ============ FORMULARIO DE INICIO DE SESIÓN ============ -->
  <main class="auth-main">
    <div class="auth-card">

      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="auth-title">Inicio sesión</h1>

      <form action="#" method="post">

        <div class="campo">
          <label for="correo">Correo institucional</label>
          <div class="campo-control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="email" id="correo" name="correo" placeholder="nombre@institucion.edu" required>
          </div>
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <div class="campo-control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/></svg>
            <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn-enviar">Enviar</button>
      </form>

      <a href="#" class="auth-enlace">¿Olvidaste tu contraseña?</a>
      <p class="auth-enlace-secundario">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
    </div>
  </main>

</body>
</html>
